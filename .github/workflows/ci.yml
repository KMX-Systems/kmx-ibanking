name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the dev image (Qt 6.11 + clang-20)
        run: docker build -t kmxbank/qt-dev:6.11.0-clang20 .

      - name: Configure + build + test inside the dev image
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -e QT_QPA_PLATFORM=offscreen \
            -e KMX_AUTOLOGIN=1 \
            kmxbank/qt-dev:6.11.0-clang20 \
            bash -lc '
              set -euo pipefail
              cmake -S /workspace -B /workspace/build -G Ninja
              cmake --build /workspace/build -j"$(nproc)"
              ctest --test-dir /workspace/build --output-on-failure

              # Smoke: autologin walks every page; timeout(124) = healthy app.
              code=0
              timeout 25 ./build/appkmxbank || code=$?
              if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi
              echo "smoke OK"
            '

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshot
          path: screenshot.png
          if-no-files-found: ignore
